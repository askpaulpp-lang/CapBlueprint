<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mete Business Blueprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* Layout: app shell — fixed left sidebar (12 sections), sticky project/status bar with global actions, scrolling work area. Tokens mirror the Mete Business Blueprint design system. */
:root{
  --bg:#faf8f3;--surface:#ffffff;--surface-2:#f2eee5;--ink:#232c3a;--ink-muted:#566172;--line:#e2dccf;--border:#808894;
  --navy:#1b2a4e;--on-navy:#ffffff;--navy-tint:#e6eaf2;--brass:#c9a227;--brass-ink:#7d6213;--brass-soft:#c9a22726;
  --ok:#2e6b45;--ok-soft:#2e6b451f;--warn:#8a5a00;--warn-soft:#8a5a001f;--danger:#a33a2c;--danger-soft:#a33a2c1f;
  --font-serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:4px;--r-md:6px;--r-lg:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161f;--surface:#18202c;--surface-2:#212a38;--ink:#e8e4da;--ink-muted:#a3abb8;--line:#2c3646;--border:#6b7586;
  --navy:#9db3de;--on-navy:#11161f;--navy-tint:#1f2c47;--brass:#d4ae3a;--brass-ink:#dcbb52;--brass-soft:#d4ae3a26;
  --ok:#73c08f;--ok-soft:#73c08f24;--warn:#e0a84a;--warn-soft:#e0a84a24;--danger:#ec8a78;--danger-soft:#ec8a7824;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161f;--surface:#18202c;--surface-2:#212a38;--ink:#e8e4da;--ink-muted:#a3abb8;--line:#2c3646;--border:#6b7586;
  --navy:#9db3de;--on-navy:#11161f;--navy-tint:#1f2c47;--brass:#d4ae3a;--brass-ink:#dcbb52;--brass-soft:#d4ae3a26;
  --ok:#73c08f;--ok-soft:#73c08f24;--warn:#e0a84a;--warn-soft:#e0a84a24;--danger:#ec8a78;--danger-soft:#ec8a7824;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/22px var(--font-sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font:600 28px/34px var(--font-serif);color:var(--ink)}
h2{font:600 18px/26px var(--font-sans)}
h3{font:600 15px/22px var(--font-sans)}
p{margin:0}
a{color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.num,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.small{font-size:13px;line-height:18px}
.label{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.eyebrow{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-ink)}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--surface-2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:20px 12px calc(20px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.brand{padding:0 8px;display:grid;gap:2px}
.brand b{font:600 17px/22px var(--font-serif);color:var(--navy)}
.brand span{font-size:12px;color:var(--ink-muted)}
.nav{display:grid;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-md);color:var(--ink);font-size:14px;line-height:20px}
.nav button:hover{background:var(--surface)}
.nav button[aria-current="page"]{background:var(--navy);color:var(--on-navy)}
.nav button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.nav .n{width:20px;font-size:11px;font-variant-numeric:tabular-nums;color:inherit;opacity:.65}
.nav .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.side-foot{margin-top:auto;padding:0 8px;font-size:12px;line-height:17px;color:var(--ink-muted)}
.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.bar .proj{display:flex;align-items:center;gap:8px 10px;min-width:0;flex:1 1 380px;flex-wrap:wrap}
.bar .proj select{flex:0 1 240px;min-width:150px;max-width:260px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);padding:5px 8px;font-weight:600}
.bar .save{font-size:12px;color:var(--ink-muted);white-space:nowrap}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.menu-btn{display:none}
.content{padding-block:28px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));display:grid;gap:24px;max-width:1240px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.head .t{display:grid;gap:4px;min-width:0;max-width:70ch}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:var(--r-md);padding:6px 12px;font-size:14px;line-height:20px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#1b2a4e}
.btn.brass:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],select,textarea{width:100%;min-width:0;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);padding:6px 9px;font-size:14px;line-height:20px}
textarea{resize:vertical;min-height:64px}
input[type=number]{font-variant-numeric:tabular-nums}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--ink-muted)}
.f{display:grid;gap:5px;min-width:0}
.f .help{font-size:12px;line-height:17px;color:var(--ink-muted)}
.f .row{display:flex;gap:6px;align-items:center}
.f .row>input{flex:1}
.f .affix{color:var(--ink-muted);font-size:13px}
.req{color:var(--danger);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stack{display:grid;gap:16px}
.res-grid{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) minmax(0,300px);gap:16px;align-items:start}
.fin-grid{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:16px;align-items:start}
.stack-sm{display:grid;gap:8px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;gap:8px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* surfaces */
.content>*,.card>*,.stack>*,.stack-sm>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;display:grid;gap:12px;min-width:0}
.card.pad-lg{padding:20px}
.well{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px}
.note{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;background:var(--navy-tint);color:var(--ink);font-size:13px;line-height:19px}
.note.warn{background:var(--warn-soft);border-color:transparent}
.note.danger{background:var(--danger-soft);border-color:transparent}
.note.brass{background:var(--brass-soft);border-color:transparent}
.illus{display:inline-flex;align-items:center;gap:6px;background:var(--brass-soft);color:var(--brass-ink);border-radius:var(--r-sm);padding:2px 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:11px;line-height:18px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-Draft{background:var(--surface-2);color:var(--ink-muted)}
.s-Researching{background:var(--navy-tint);color:var(--navy)}
.s-Needs{background:var(--brass-soft);color:var(--brass-ink)}
.s-Ready{background:var(--ok-soft);color:var(--ok)}
.s-Published{background:var(--navy);color:var(--on-navy)}
.t-Verified{background:var(--ok-soft);color:var(--ok)}
.t-Estimated{background:var(--warn-soft);color:var(--warn)}
.t-User{background:var(--navy-tint);color:var(--navy)}
.t-Assumption{background:var(--brass-soft);color:var(--brass-ink)}
.sev-Critical{background:var(--danger-soft);color:var(--danger)}
.sev-High{background:var(--warn-soft);color:var(--warn)}
.sev-Medium{background:var(--navy-tint);color:var(--navy)}
.sev-Low{background:var(--surface-2);color:var(--ink-muted)}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--danger-soft);color:var(--danger)}
.c-info{background:var(--navy-tint);color:var(--navy)}
.tagsel{width:auto!important;font-size:12px!important;padding:3px 6px!important}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:2px;min-width:0}
.kpi .v{font:600 24px/30px var(--font-sans);font-variant-numeric:tabular-nums}
.kpi .v.bad{color:var(--danger)}
.kpi .v.good{color:var(--ok)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:20px}
th{background:var(--surface-2);text-align:left;font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td input,td select,td textarea{padding:4px 6px;font-size:13px}
td .w-num{width:88px}
tr.neg td.n{color:var(--danger)}
tr.total td{font-weight:600;background:var(--surface-2)}
tr.sel td{background:var(--navy-tint)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-size:14px;color:var(--ink-muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--navy)}

/* panels */
details.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
details.panel>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary .chev{transition:transform .15s;color:var(--ink-muted)}
details.panel[open]>summary .chev{transform:rotate(90deg)}
details.panel .body{padding:0 16px 16px;display:grid;gap:16px}
.score{display:inline-grid;place-items:center;min-width:52px;padding:2px 8px;border-radius:var(--r-sm);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.bar-meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar-meter i{display:block;height:100%;background:var(--brass)}
.rule{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:start;font-size:14px}
.rule .mk{font-weight:700}
.rule .mk.y{color:var(--ok)}
.rule .mk.n{color:var(--danger)}

/* funnel */
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.fstep{background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;display:grid;gap:2px;position:relative;min-width:0}
.fstep .v{font:600 20px/26px var(--font-sans);font-variant-numeric:tabular-nums}
.fstep .fill{position:absolute;left:0;bottom:0;height:3px;background:var(--navy);border-radius:0 0 0 var(--r-md)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line)}
.chart text{fill:var(--ink-muted);font-size:11px;font-family:var(--font-sans)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* steps */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface-2);font-size:13px}
.steps button b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface);font-size:12px;border:1px solid var(--line)}
.steps button[aria-current="step"]{background:var(--navy);color:var(--on-navy)}
.steps button[aria-current="step"] b{background:var(--brass);color:#1b2a4e;border-color:var(--brass)}
.steps button.done b{background:var(--ok);color:var(--on-navy);border-color:var(--ok)}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;display:grid;gap:6px}
.task.top{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.task.done .tt{text-decoration:line-through;color:var(--ink-muted)}
.task .tt{font-weight:500}

/* report */
.sheet{background:#fffdf8;color:#232c3a;border:1px solid var(--line);border-radius:var(--r-lg);padding:48px 56px;max-width:880px;width:100%;margin:0 auto;display:grid;gap:22px;font-size:14px;line-height:21px}
.sheet h1{font:600 30px/36px var(--font-serif);color:#1b2a4e}
.sheet h2{font:600 20px/26px var(--font-serif);color:#1b2a4e;border-bottom:2px solid #c9a227;padding-bottom:4px}
.sheet h3{font-size:14px;color:#1b2a4e}
.sheet .muted{color:#566172}
.sheet table th{background:#f2eee5;color:#566172}
.sheet table td,.sheet table th{border-color:#e2dccf}
.sheet .tw{background:#fff;border-color:#e2dccf}
.sheet .cover{border-left:6px solid #c9a227;padding:8px 0 8px 20px;display:grid;gap:8px}
.sheet .pg{font-size:11px;color:#566172;text-align:right;border-top:1px solid #e2dccf;padding-top:4px}
.sheet .illus{background:#c9a22726;color:#7d6213}
.sheet .chip{background:#f2eee5;color:#232c3a}
.sheet .chip.t-Assumption{background:#c9a22726;color:#7d6213}
.sheet .chip.t-Verified{background:#2e6b451f;color:#2e6b45}
.sheet td input{background:#fff}

/* toast + banners */
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--r-md);font-size:14px;max-width:min(420px,calc(100vw - 32px))}
.banner{padding:8px max(24px,env(safe-area-inset-right,0px)) 8px max(24px,env(safe-area-inset-left,0px));font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft)}
.banner.info{background:var(--navy-tint)}
.modal-bg{position:fixed;inset:0;background:#0008;z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;display:grid;gap:14px;border:1px solid var(--line)}
.empty{display:grid;place-items:center;text-align:center;gap:10px;padding:48px 16px;border:1px dashed var(--border);border-radius:var(--r-md);background:var(--surface)}
.skel{height:14px;border-radius:4px;background:var(--surface-2)}

@media (max-width:1240px){.fin-grid{grid-template-columns:minmax(0,1fr)}.res-grid{grid-template-columns:minmax(0,1fr) minmax(0,300px)}.res-grid>:first-child{grid-column:1/-1}}
@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:45;transform:translateX(-100%);transition:transform .2s;height:100%;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .app.open .side{transform:none;box-shadow:0 0 0 100vmax #0007}
  .menu-btn{display:inline-flex}
  .bar{position:static;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .actions{flex-wrap:nowrap;overflow-x:auto;flex:1 1 100%;min-width:0;padding-bottom:2px}
  .bar .proj{flex-wrap:wrap;flex:1 1 0;min-width:0}
  .bar .save{white-space:normal}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
  .grid2,.grid3,.grid4,.res-grid{grid-template-columns:minmax(0,1fr)}
  .funnel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet{padding:24px 18px}
  .banner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      </div>

</div>

<script id="engine">
/*ENGINE-START*/
const Engine = (() => {
  const num = v => { const n = typeof v === 'number' ? v : parseFloat(v); return Number.isFinite(n) ? n : 0; };
  const av = a => (a && typeof a === 'object' && 'v' in a) ? num(a.v) : num(a);
  const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
  const WEEKS = 4.33;

  function amortPayment(principal, annualRatePct, months) {
    principal = num(principal); months = Math.max(1, Math.round(num(months)) || 1);
    const r = num(annualRatePct) / 100 / 12;
    if (principal <= 0) return 0;
    if (r === 0) return principal / months;
    return principal * r / (1 - Math.pow(1 + r, -months));
  }

  function modelOf(p, key) { return p.ops.models[key || p.ops.selected] || p.ops.models.lean; }

  function unitEconomics(p, opt = {}) {
    const priceMul = opt.priceMul ?? 1, costMul = opt.costMul ?? 1;
    const prods = (p.products || []).filter(x => num(x.mix) > 0);
    const mixTot = sum(prods, x => num(x.mix));
    const avgPrice = mixTot ? sum(prods, x => num(x.mix) / mixTot * num(x.price)) * priceMul : 0;
    const avgCost = mixTot ? sum(prods, x => num(x.mix) / mixTot * num(x.unitCost)) * costMul : 0;
    const chans = (p.channels || []).filter(c => num(c.share) > 0);
    const chTot = sum(chans, c => num(c.share));
    const realization = chTot ? sum(chans, c => num(c.share) / chTot * num(c.realization) / 100) : 1;
    const delays = chTot ? chans.map(c => ({ frac: num(c.share) / chTot, months: Math.max(0, Math.round(num(c.collectDays) / 30)) })) : [{ frac: 1, months: 0 }];
    const realizedPrice = avgPrice * realization;
    const feePct = av(p.fin.a.paymentFee) / 100;
    const unitVar = avgCost + realizedPrice * feePct;
    const unitContribution = realizedPrice - unitVar;
    return { avgPrice, avgCost, realization, realizedPrice, unitVar, unitContribution, delays, mixTot, chTot,
      contributionMargin: realizedPrice > 0 ? unitContribution / realizedPrice : 0,
      grossMargin: realizedPrice > 0 ? (realizedPrice - avgCost) / realizedPrice : 0 };
  }

  function run(p, opt = {}) {
    const volMul = opt.volMul ?? 1;
    const m = modelOf(p, opt.model);
    const A = p.fin.a;
    const ue = unitEconomics(p, opt);
    const payrollTax = av(A.payrollTax) / 100;
    const staff = m.staff || [];
    const payroll = sum(staff, s => num(s.hours) * num(s.rate) * WEEKS) * (1 + payrollTax);
    const staffHours = sum(staff, s => num(s.hours)) * WEEKS;
    const ownerHours = av(A.ownerHours) * WEEKS;
    const hpu = av(A.hoursPerUnit);
    const laborCap = hpu > 0 ? (ownerHours + staffHours) / hpu : Infinity;
    const equipCap = num(m.capacity) > 0 ? num(m.capacity) : Infinity;
    const capacity = Math.min(laborCap, equipCap);
    const marketing = sum(p.channels || [], c => num(c.spend));
    const otherFixed = sum(p.fin.fixed || [], f => num(f.amount)) + num(m.fixed);
    const fixedTotal = otherFixed + payroll + marketing;
    const beUnits = ue.unitContribution > 0 ? fixedTotal / ue.unitContribution : (fixedTotal === 0 ? 0 : null);
    const equipment = sum(m.equipment || [], e => num(e.cost));
    const usesOther = sum(p.fin.uses || [], u => num(u.amount));
    const uses = usesOther + equipment;
    const funding = sum(p.fin.funding || [], f => num(f.amount));
    const loans = (p.fin.funding || []).filter(f => f.type === 'Loan' && num(f.amount) > 0)
      .map(f => ({ bal: num(f.amount), rate: num(f.rate) / 100 / 12, pay: amortPayment(f.amount, f.rate, f.term), left: Math.max(1, Math.round(num(f.term)) || 1) }));
    const season = p.fin.season && p.fin.season.length === 12 ? p.fin.season : Array(12).fill(100);
    const launch = String(p.profile.launchDate || '');
    const startMonth = /^\d{4}-\d{2}/.test(launch) ? (parseInt(launch.slice(5, 7), 10) - 1) : 0;
    const growth = av(A.growth) / 100;
    const lead = av(A.leadRate) / 100, qual = av(A.qualRate) / 100, close = av(A.closeRate) / 100, rep = av(A.repeatRate) / 100, upo = av(A.unitsPerOrder);
    const cash0 = funding - uses;
    const months = [];
    const receipts = Array(12 + 12).fill(0);
    let base = 0, cash = cash0;
    for (let i = 0; i < 12; i++) {
      const s = num(season[(startMonth + i) % 12]) / 100;
      const contacts = av(A.contacts) * Math.pow(1 + growth, i) * s * volMul;
      const leads = contacts * lead, qualified = leads * qual, newCust = qualified * close;
      const repeatOrders = base * rep;
      const ordersDemand = newCust + repeatOrders;
      const unitsDemand = ordersDemand * upo;
      const units = Math.min(unitsDemand, capacity);
      const fill = unitsDemand > 0 ? units / unitsDemand : 1;
      base += newCust * fill;
      const revenue = units * ue.realizedPrice;
      const cogs = units * ue.avgCost;
      const varCost = units * ue.unitVar;
      const contribution = revenue - varCost;
      const opResult = contribution - fixedTotal;
      let interest = 0, principal = 0;
      loans.forEach(l => { if (l.left > 0 && l.bal > 0) { const it = l.bal * l.rate; const pr = Math.min(l.bal, l.pay - it); interest += it; principal += pr; l.bal -= pr; l.left--; } });
      ue.delays.forEach(d => { receipts[i + d.months] += revenue * d.frac; });
      const payments = varCost + fixedTotal;
      const debtService = interest + principal;
      cash = cash + receipts[i] - payments - debtService;
      months.push({ i, contacts, leads, qualified, newCust, repeatOrders, orders: ordersDemand * fill, unitsDemand, units,
        overflow: Math.max(0, unitsDemand - units), utilization: Number.isFinite(capacity) && capacity > 0 ? units / capacity : 0,
        revenue, cogs, varCost, contribution, fixed: fixedTotal, opResult, interest, principal, net: opResult - interest,
        receipts: receipts[i], payments, debtService, cash });
    }
    const t = k => sum(months, x => x[k]);
    const totals = { revenue: t('revenue'), cogs: t('cogs'), varCost: t('varCost'), contribution: t('contribution'), fixed: t('fixed'), opResult: t('opResult'), interest: t('interest'), net: t('net'), units: t('units'), unitsDemand: t('unitsDemand'), overflow: t('overflow'), newCust: t('newCust') };
    const minCash = Math.min(cash0, ...months.map(x => x.cash));
    const firstNegCash = months.findIndex(x => x.cash < 0);
    const beMonth = months.findIndex(x => x.opResult >= 0);
    const avgNew = totals.newCust / 12;
    const cac = avgNew > 0 ? marketing / avgNew : (marketing > 0 ? Infinity : 0);
    const custContribution = ue.unitContribution * upo;
    const paybackOrders = custContribution > 0 ? cac / custContribution : null;
    return { ue, model: m, payroll, staffHours, ownerHours, laborCap, equipCap, capacity, marketing, otherFixed, fixedTotal, beUnits,
      equipment, uses, funding, cash0, months, totals, minCash, firstNegCash, beMonth, cac, custContribution, paybackOrders,
      capacityShort: months.some(x => x.overflow > 0.5), startMonth };
  }

  function sensitivity(p, priceSteps = [-0.1, -0.05, 0, 0.05, 0.1], volSteps = [-0.2, -0.1, 0, 0.1, 0.2]) {
    return volSteps.map(v => ({ vol: v, cells: priceSteps.map(pr => ({ price: pr, op: run(p, { volMul: 1 + v, priceMul: 1 + pr }).totals.opResult })) }));
  }

  function scenarios(p) {
    const s = p.settings.scenarios;
    return ['worst', 'base', 'best'].map(k => {
      const o = k === 'base' ? {} : { volMul: num(s[k].vol) / 100, priceMul: num(s[k].price) / 100, costMul: num(s[k].cost) / 100 };
      const r = run(p, o);
      return { key: k, r };
    });
  }

  return { run, sensitivity, scenarios, unitEconomics, amortPayment, num, av };
})();
/*ENGINE-END*/
</script>

const CAP_PANELS = [

const has = s => String(s || '').trim().length > 3;
const CAP_RULES = [
  { id: 'mci1', panel: 'mci', pts: 2, text: 'At least one verified market source', test: p => p.sources.some(s => s.category === 'Market' && s.kind === 'Verified' && !s.flagged), action: 'Add a dated, verified market source for your area (Research & Sources).' },

  { id: 'mci4', panel: 'mci', pts: 1, text: 'Your price compared with competitor prices', test: p => p.competitors.some(c => num(c.price) > 0), action: 'Add competitor prices so pricing can be checked.' },
  { id: 'mkt1', panel: 'mkt', pts: 1, text: 'Two or more acquisition channels', test: p => p.channels.filter(c => num(c.share) > 0).length >= 2, action: 'Add a second channel so sales do not depend on one source.' },
  { id: 'mkt2', panel: 'mkt', pts: 2, text: 'Acquisition cost recovered within 2 orders', test: (p, r) => r.paybackOrders !== null && r.paybackOrders <= 2, action: 'Lower paid spend or raise contribution per order until a new customer pays back within 2 orders.' },
  { id: 'mkt3', panel: 'mkt', pts: 1, text: 'Marketing spend at or below 15% of revenue', test: (p, r) => r.totals.revenue > 0 && r.marketing * 12 <= 0.15 * r.totals.revenue, action: 'Bring marketing spend under 15% of revenue or show why more is needed.' },
  { id: 'mkt4', panel: 'mkt', pts: 1, text: 'Positioning and messaging written', test: p => has(p.capPlan.positioning) && has(p.capPlan.messaging), action: 'Write a one-line positioning statement and the core message.' },
  { id: 'sal1', panel: 'sal', pts: 2, text: 'Close rate at or above 20% of qualified leads', test: p => av(p.fin.a.closeRate) >= 20, action: 'Tighten the offer and follow-up to close at least 20% of qualified leads.', whatIf: p => { p.fin.a.closeRate.v = 20; } },
  { id: 'sal2', panel: 'sal', pts: 1, text: 'Sales script written', test: p => has(p.capPlan.scripts), action: 'Write the reply script for the most common inquiry.' },

  { id: 'gfr2', panel: 'gfr', pts: 2, text: 'Funding covers startup uses', test: (p, r) => r.funding >= r.uses, action: 'Line up funding equal to startup uses before launch.' },
  { id: 'gfr3', panel: 'gfr', pts: 1, text: 'Operating result positive by month 9', test: (p, r) => r.beMonth >= 0 && r.beMonth <= 8, action: 'Reach a positive monthly operating result by month 9.' }];

function capScores(p, r) {
  const out = {};
  CAP_PANELS.forEach(([k]) => { out[k] = { pts: 0, max: 0, rules: [] }; });
  CAP_RULES.forEach(rule => {
    const w = p.capWeights[rule.id] ?? rule.pts;
    let pass = false; try { pass = !!rule.test(p, r); } catch (e) { pass = false; }
    const o = out[rule.panel]; o.max += num(w); if (pass) o.pts += num(w);
    o.rules.push({ rule, w: num(w), pass });
  });
  Object.values(out).forEach(o => { o.score = o.max > 0 ? Math.round(o.pts / o.max * 100) : 0; });
  return out;
}
function whatIfImpact(p, r, rule) {
  if (!rule.whatIf) return null;
  const q = clone(p); rule.whatIf(q);
  return Engine.run(q).totals.opResult - r.totals.opResult;
}

/* ---------- consistency checks → review queue ---------- */
function reviewItems(p, r) {
  const items = [];
  const add = (id, kind, text, blocking, detail = '') => items.push({ id, kind, text, blocking, detail });
  const labels = { contacts: 'Monthly contacts', leadRate: 'Lead rate', qualRate: 'Qualified rate', closeRate: 'Close rate', repeatRate: 'Repeat rate', unitsPerOrder: 'Units per order', growth: 'Contact growth', hoursPerUnit: 'Labor hours per unit' };
  Object.entries(labels).forEach(([k, l]) => { const a = p.fin.a[k]; if (a && a.tag === 'Assumption' && !a.src) add('assume-' + k, 'Unsupported assumption', `${l} (${a.v}) is a model assumption with no source.`, false, 'Attach a source or confirm as user input.'); });
  p.products.forEach(x => { if (x.tag === 'Assumption') add('prod-' + x.id, 'Unsupported assumption', `Price/cost for “${x.name}” is an assumption.`, false); });
  if (r.ue.unitContribution <= 0) add('neg-contrib', 'Financial anomaly', `Each unit loses ${money(-r.ue.unitContribution, 2)} after variable costs. No break-even is possible.`, true);
  if (r.cash0 < 0 || r.firstNegCash >= 0) add('neg-cash', 'Financial anomaly', r.cash0 < 0 ? `Startup uses exceed funding by ${money(-r.cash0)} before the first month.` : `Cash goes negative in month ${r.firstNegCash + 1} (${monthLabel(r, r.firstNegCash)}). Lowest balance ${money(r.minCash)}.`, true);
  if (r.capacityShort) { const worst = r.months.reduce((a, b) => b.overflow > a.overflow ? b : a); add('capacity', 'Financial anomaly', `Demand exceeds capacity in ${r.months.filter(x => x.overflow > 0.5).length} month(s); worst is ${monthLabel(r, worst.i)} with ${n0(worst.overflow)} units unserved. Sales were capped at capacity.`, true, 'Alternatives: pre-order cutoffs, higher prices, or a larger operating model.'); }
  p.risks.filter(x => x.severity === 'Critical' && x.status === 'Unverified').forEach(x => add('risk-' + x.id, 'Critical compliance item', `${x.issue} (${x.geography}) is unverified.`, true, x.note));
  if (num(p.profile.targetRevenue) > 0 && r.totals.revenue < 0.5 * num(p.profile.targetRevenue)) add('target-gap', 'Conflicting recommendation', `Plan revenue ${money(r.totals.revenue)} is under half of the ${money(num(p.profile.targetRevenue))} target.`, false, 'Either the target or the acquisition plan needs to change.');
  if (r.funding < r.uses) add('funding-gap', 'Financial anomaly', `Funding ${money(r.funding)} is short of startup uses ${money(r.uses)}.`, true);
  p.sources.filter(s => s.flagged).forEach(s => add('src-' + s.id, 'Unsupported assumption', `Source marked incorrect: “${s.title || s.claim}”.`, false));
  (p.reviewManual || []).forEach(m => add(m.id, m.kind, m.text, !!m.blocking));
  return items;
}
function openBlocking(p, items) { return items.filter(i => i.blocking && !['Approve', 'Reject'].includes(p.reviewDecisions[i.id]?.status)); }
function riskGate(p) {
  const crit = p.risks.filter(x => x.severity === 'Critical');
  const open = crit.filter(x => x.status === 'Unverified' && !x.ack);
  return { open, pass: open.length === 0 };
}

/* ---------- state ---------- */
const S = { projects: {}, order: [], cur: null, screen: 'dashboard', tab: { research: 'Market', ops: 'Legal & Setup', fin: 'Assumptions' }, wiz: { step: 1, data: {} },
  db: null, user: null, me: null, dl: null, storeMode: 'loading', loaded: false, saveState: {}, dirty: {}, remote: {}, navOpen: false, expanded: {}, versions: {} };
const P = () => S.projects[S.cur] || null;

function persistLocal() { try { localStorage.setItem('mbb.projects', JSON.stringify(S.projects)); } catch (e) {} }
function loadLocal() { try { const j = localStorage.getItem('mbb.projects'); return j ? JSON.parse(j) : {}; } catch (e) { return {}; } }
function remember(k, v) { try { localStorage.setItem('mbb.' + k, v); } catch (e) {} }
function recall(k) { try { return localStorage.getItem('mbb.' + k); } catch (e) { return null; } }

const saveTimers = {};
function markDirty(p, auditEntry) {
  p.updatedAt = new Date().toISOString();
  if (auditEntry) logAudit(p, auditEntry);
  S.dirty[p.id] = true; S.saveState[p.id] = 'pending';
  clearTimeout(saveTimers[p.id]);
  saveTimers[p.id] = setTimeout(() => saveProject(p.id), 900);
  renderLive('save');
}
async function saveProject(id) {
  const p = S.projects[id]; if (!p) return;
  S.saveState[id] = 'saving'; renderLive('save');
  if (p.audit.length > 400) p.audit = p.audit.slice(-400);
  const stamp = p.updatedAt;
  try {
    if (S.db) await S.db.doc('projects/' + id).set(clone(p));
    else persistLocal();
    if (S.projects[id] && S.projects[id].updatedAt === stamp) { S.dirty[id] = false; S.saveState[id] = 'saved:' + new Date().toISOString(); }
  } catch (e) {
    S.saveState[id] = 'error:' + (e && e.code === 'quota_exceeded' ? 'Storage is full. Archive or delete old blueprints.' : 'Could not save. Your changes are still here.');
  }
  renderLive('save');
}
function logAudit(p, e) {
  const last = p.audit[p.audit.length - 1];
  const at = new Date().toISOString();
  if (last && e.path && last.path === e.path && last.actor === (S.me || '') && (Date.parse(at) - Date.parse(last.at)) < 15000 && !e.reason) { last.after = e.after; last.at = at; return; }
  p.audit.push(Object.assign({ at, actor: S.me || '' }, e));
}

/* ---------- boot ---------- */
async function boot() {
  S.screen = (location.hash || '').slice(1) || recall('screen') || 'dashboard';
  if (!SCREENS.some(s => s[0] === S.screen)) S.screen = 'dashboard';
  render();
  const c = window.claude;
  const [db, user, dl] = await Promise.all([c?.use ? c.use('db').catch(() => null) : null, c?.use ? c.use('user').catch(() => null) : null, c?.use ? c.use('downloads').catch(() => null) : null]);
  S.db = db; S.user = user; S.dl = dl;
  if (user) { try { S.me = await user.id(); } catch (e) {} }
  if (db) {
    S.storeMode = 'shared';
    db.collection('projects').onSnapshot(snap => {
      snap.docs.forEach(d => {
        if (!d.exists) return; const data = d.data(); if (!data || !data.id) return;
        const local = S.projects[data.id];
        if (local && S.dirty[data.id]) { if (data.updatedAt > local.updatedAt) { S.remote[data.id] = clone(data); renderBanners(); } return; }
        if (!local || (data.updatedAt || '') > (local.updatedAt || '')) S.projects[data.id] = normalize(clone(data));
      });
      snap.docChanges().forEach(ch => { if (ch.type === 'removed' && S.projects[ch.doc.id] && !S.dirty[ch.doc.id]) delete S.projects[ch.doc.id]; });
      S.loaded = true;
      if (!S.cur || !S.projects[S.cur]) S.cur = recall('cur') && S.projects[recall('cur')] ? recall('cur') : sortedProjects()[0]?.id || null;
      if (!d_activeInput()) render(); else { renderSide(); renderBar(); }
    }, err => { S.storeMode = 'local'; S.projects = loadLocal(); Object.values(S.projects).forEach(normalize); S.loaded = true; render(); });
  } else {
    S.storeMode = 'local'; S.projects = loadLocal(); Object.values(S.projects).forEach(normalize); S.loaded = true;
    S.cur = recall('cur') && S.projects[recall('cur')] ? recall('cur') : sortedProjects()[0]?.id || null;
    render();
  }
}
function d_activeInput() { const a = document.activeElement; return a && a.matches && a.matches('input,textarea,select') && a.closest('#content'); }
function sortedProjects() { return Object.values(S.projects).filter(p => !p.archived).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || '')); }

/* ---------- charts ---------- */
function lineChart(series, o = {}) {
  const W = 640, H = o.h || 220, L = 56, R = 12, T = 12, B = 26;
  const all = series.flatMap(s => s.data).concat(o.extraY || []);
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all); if (hi === lo) hi = lo + 1;
  const step = niceStep((hi - lo) / 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const n = series[0].data.length;
  const x = i => L + (W - L - R) * (n === 1 ? 0.5 : i / (n - 1)), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ticks = []; for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(v);
  const bw = (W - L - R) / n * 0.6;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Chart')}">
    ${ticks.map(v => `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" ${v === 0 ? 'style="stroke:var(--border)"' : ''}/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${o.money ? compactMoney(v) : n0(v)}</text>`).join('')}
    ${(o.labels || []).map((l, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`).join('')}
    ${series.map(s => s.bars ? s.data.map((v, i) => `<rect x="${x(i) - bw / 2}" y="${Math.min(y(v), y(0))}" width="${bw}" height="${Math.abs(y(v) - y(0))}" style="fill:${s.color}" rx="2"/>`).join('') : '').join('')}
    ${(o.hlines || []).map(h => `<line x1="${L}" x2="${W - R}" y1="${y(h.v)}" y2="${y(h.v)}" style="stroke:${h.color};stroke-width:1.5" stroke-dasharray="${h.dash || '5 4'}"/>`).join('')}
    ${series.filter(s => !s.bars).map(s => `<polyline fill="none" style="stroke:${s.color}" stroke-width="2.2" stroke-linejoin="round" points="${s.data.map((v, i) => `${x(i)},${y(v)}`).join(' ')}"/><circle cx="${x(n - 1)}" cy="${y(s.data[n - 1])}" r="3.5" style="fill:${s.color}"/>`).join('')}
    ${o.marker != null && o.marker >= 0 ? `<line x1="${x(o.marker)}" x2="${x(o.marker)}" y1="${T}" y2="${H - B}" style="stroke:var(--brass)" stroke-width="1.5"/><text x="${x(o.marker) + 4}" y="${T + 10}" style="fill:var(--brass-ink)">${esc(o.markerLabel || '')}</text>` : ''}
  </svg></div>`;
}
function niceStep(raw) { const e = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-9)))); const f = raw / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
function compactMoney(v) { const a = Math.abs(v); const s = a >= 1000 ? (a / 1000).toFixed(a >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(Math.round(a)); return (v < 0 ? '−$' : '$') + s; }
const legend = items => `<div class="legend">${items.map(([c, l, dash]) => `<span><i style="background:${c};${dash ? 'height:0;border-top:2px dashed ' + c + ';background:none' : ''}"></i>${esc(l)}</span>`).join('')}</div>`;

function chCheck() { const p = P(); const t = p.channels.reduce((s, c) => s + num(c.share), 0); return Math.round(t) === 100 ? '' : `<div class="note warn">Channel shares add up to ${n1(t)}%. The model scales them to 100%.</div>`; }
function funnelHTML() {
  const p = P(); const r = Engine.run(p); const m = r.months; const avg = k => m.reduce((s, x) => s + x[k], 0) / 12;

  return `<div class="funnel">${steps.map(([l, v]) => `<div class="fstep"><span class="label">${l}</span><span class="v">${n1(v)}</span><span class="fill" style="width:${Math.max(4, v / max * 100)}%"></span></div>`).join('')}</div>

  </div>`;
}
function capPanelsHTML() {

        <div class="stack-sm"><span class="label">Assessment rules (${o.pts} of ${o.max} points)</span>${o.rules.map(x => `<div class="rule"><span class="mk ${x.pass ? 'y' : 'n'}" aria-label="${x.pass ? 'Pass' : 'Fail'}">${x.pass ? '✓' : '✕'}</span><span>${esc(x.rule.text)}</span>${p.settings.consultant ? `<input type="number" min="0" step="1" style="width:56px" data-weight="${x.rule.id}" value="${x.w}" aria-label="Points for ${esc(x.rule.text)}">` : `<span class="small muted">${x.w} pt</span>`}</div>`).join('')}</div>
        <div class="stack-sm"><span class="label">Evidence</span>${ev.length ? ev.map(s => `<div class="small"><span class="chip ${tagClass(s.kind)}">${esc(s.kind)}</span> ${esc(s.claim)}${s.value ? ': <b>' + esc(s.value) + '</b>' : ''}</div>`).join('') : '<p class="small muted">No evidence attached for this area yet.</p>'}</div>
      </div>
      <div class="stack-sm"><span class="label">Problems and recommended actions</span>${failed.length ? failed.map(x => { const imp = whatIfImpact(p, r, x.rule); const d = p.recDecisions[x.rule.id]; return `<div class="well stack-sm"><div><b>${esc(x.rule.text)}</b> is not met.</div><div>${esc(x.rule.action)}</div>
        <div class="small muted">Expected financial impact: ${imp === null ? 'not modeled for this action' : `${imp >= 0 ? '+' : ''}${money(imp)} 12-month operating result if ${x.rule.whatIfLabel || 'the rule threshold is met'} (model estimate)`}</div>

      <div class="grid2">${fld('Assumptions & notes', 'cap.' + k + '.notes', { type: 'textarea' })}<div class="stack-sm">${fld('Confidence', 'cap.' + k + '.confidence', { type: 'select', options: ['High', 'Medium', 'Low'] })}</div></div>
    </div></details>`;
  }).join('');
}

      <div class="card"><h2>Fixed expenses / month</h2>${tableEditor('fin.fixed', [{ key: 'name', label: 'Expense', w: 170 }, { key: 'amount', label: '$ / mo', type: 'num' }], { tpl: { name: '', amount: 0 }, addLabel: 'Add expense' })}<p class="small muted">Payroll comes from Staffing and marketing from channel spend; they are not entered here, so nothing is counted twice.</p></div>

function finResults() {
  const p = P(); const r = Engine.run(p); const T = r.totals; const L = r.months.map(x => monthLabel(r, x.i));
  const sc = Engine.scenarios(p); const sens = Engine.sensitivity(p);
  const row = (label, k, o = {}) => `<tr class="${o.cls || ''}"><td>${label}</td>${r.months.map(x => `<td class="n" style="${x[k] < -0.5 && o.neg ? 'color:var(--danger)' : ''}">${money(x[k])}</td>`).join('')}<td class="n"><b>${o.noTotal ? '' : money(T[k] ?? 0)}</b></td></tr>`;
  return `<div class="kpis">
    <div class="kpi"><span class="label">12-mo revenue</span><span class="v">${money(T.revenue)}</span><span class="small muted">Not profit</span></div>
    <div class="kpi"><span class="label">Contribution margin</span><span class="v ${r.ue.unitContribution <= 0 ? 'bad' : ''}">${pct(r.ue.contributionMargin)}</span><span class="small muted">${money(r.ue.unitContribution, 2)} per unit</span></div>
    <div class="kpi"><span class="label">12-mo operating result</span><span class="v ${T.opResult < 0 ? 'bad' : 'good'}">${money(T.opResult)}</span><span class="small muted">Before owner pay & income tax</span></div>
    <div class="kpi"><span class="label">Break-even</span><span class="v">${r.beUnits === null ? 'None' : n0(r.beUnits)}</span><span class="small muted">${r.beUnits === null ? 'Unit contribution ≤ 0' : `units / mo · ${r.beMonth >= 0 ? 'first reached ' + L[r.beMonth] : 'not reached in 12 mo'}`}</span></div>
    <div class="kpi"><span class="label">Lowest cash</span><span class="v ${r.minCash < 0 ? 'bad' : ''}">${money(r.minCash)}</span><span class="small muted">${r.firstNegCash >= 0 ? 'Negative in ' + L[r.firstNegCash] : 'Opening ' + money(r.cash0)}</span></div>
  </div>
  ${r.capacityShort ? `<div class="note danger"><b>Capacity limits sales.</b> ${n0(T.overflow)} units of demand could not be served by the ${esc(r.model.name)} model. Revenue below reflects capped volume. See OPS Design → Capacity.</div>` : ''}
  ${r.ue.unitContribution <= 0 ? `<div class="note danger"><b>Each unit loses money after variable costs.</b> Raise prices or lower unit costs; break-even is impossible as entered.</div>` : ''}
  ${num(p.profile.targetOwnerIncome) > 0 ? `<div class="note ${T.opResult >= num(p.profile.targetOwnerIncome) ? '' : 'warn'}">Target owner income is ${money(num(p.profile.targetOwnerIncome))} / yr. The 12-month operating result after interest is ${money(T.net)}${T.net < num(p.profile.targetOwnerIncome) ? ', short of the target' : ''}.</div>` : ''}
  <div class="card"><div class="between"><h2>Revenue vs total cost</h2>${legend([['var(--navy)', 'Revenue'], ['var(--danger)', 'Variable + fixed cost']])}</div>
    ${lineChart([{ data: r.months.map(x => x.revenue), color: 'var(--navy)' }, { data: r.months.map(x => x.varCost + x.fixed), color: 'var(--danger)' }], { labels: L, money: 1, marker: r.beMonth, markerLabel: 'break-even', label: 'Revenue versus total cost by month' })}</div>
  <div class="card"><div class="between"><h2>Cash runway</h2>${legend([['var(--ok)', 'Month-end cash']])}</div>
    ${lineChart([{ data: r.months.map(x => x.cash), color: 'var(--ok)' }], { labels: L, money: 1, label: 'Month-end cash balance' })}
    <p class="small muted">Opening cash ${money(r.cash0)} = funding ${money(r.funding)} − startup uses ${money(r.uses)}.</p></div>
  <div class="card"><h2>12-month P&L</h2><div class="tw"><table><thead><tr><th>$</th>${L.map(l => `<th class="n">${l}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>
    <tr><td>Units sold</td>${r.months.map(x => `<td class="n">${n0(x.units)}</td>`).join('')}<td class="n"><b>${n0(T.units)}</b></td></tr>
    ${row('Revenue', 'revenue')}${row('Cost of goods', 'cogs')}${row('Variable costs (incl. fees)', 'varCost')}${row('Contribution', 'contribution', { cls: 'total' })}${row('Fixed operating expenses', 'fixed')}${row('Operating result', 'opResult', { cls: 'total', neg: 1 })}${row('Interest', 'interest')}${row('Result after interest', 'net', { neg: 1 })}
  </tbody></table></div></div>
  <div class="card"><h2>Cash flow</h2><div class="tw"><table><thead><tr><th>$</th>${L.map(l => `<th class="n">${l}</th>`).join('')}</tr></thead><tbody>
    <tr><td>Cash receipts</td>${r.months.map(x => `<td class="n">${money(x.receipts)}</td>`).join('')}</tr>
    <tr><td>Operating payments</td>${r.months.map(x => `<td class="n">${money(x.payments)}</td>`).join('')}</tr>
    <tr><td>Debt service</td>${r.months.map(x => `<td class="n">${money(x.debtService)}</td>`).join('')}</tr>
    <tr class="total"><td>Month-end cash</td>${r.months.map(x => `<td class="n" style="${x.cash < 0 ? 'color:var(--danger)' : ''}">${money(x.cash)}</td>`).join('')}</tr>
  </tbody></table></div></div>
  <div class="card"><h2>Scenarios</h2><div class="tw"><table><thead><tr><th></th>${sc.map(s => `<th class="n">${s.key[0].toUpperCase() + s.key.slice(1)}</th>`).join('')}</tr></thead><tbody>
    <tr><td>Settings (volume / price / cost)</td>${sc.map(s => `<td class="n small">${s.key === 'base' ? 'As entered' : `${p.settings.scenarios[s.key].vol}% / ${p.settings.scenarios[s.key].price}% / ${p.settings.scenarios[s.key].cost}%`}</td>`).join('')}</tr>
    <tr><td>12-mo revenue</td>${sc.map(s => `<td class="n">${money(s.r.totals.revenue)}</td>`).join('')}</tr>
    <tr><td>12-mo operating result</td>${sc.map(s => `<td class="n" style="color:${s.r.totals.opResult < 0 ? 'var(--danger)' : 'inherit'}">${money(s.r.totals.opResult)}</td>`).join('')}</tr>
    <tr><td>Lowest cash</td>${sc.map(s => `<td class="n" style="color:${s.r.minCash < 0 ? 'var(--danger)' : 'inherit'}">${money(s.r.minCash)}</td>`).join('')}</tr>
  </tbody></table></div><p class="small muted">Change scenario settings in Settings.</p></div>
  <div class="card"><h2>Sensitivity: 12-month operating result</h2><div class="tw"><table><thead><tr><th>Volume \\ Price</th>${sens[0].cells.map(c => `<th class="n">${c.price > 0 ? '+' : ''}${Math.round(c.price * 100)}%</th>`).join('')}</tr></thead><tbody>
    ${sens.map(rw => `<tr><td>${rw.vol > 0 ? '+' : ''}${Math.round(rw.vol * 100)}%</td>${rw.cells.map(c => `<td class="n" style="${c.op < 0 ? 'color:var(--danger)' : ''}${c.price === 0 && rw.vol === 0 ? ';font-weight:700' : ''}">${money(c.op)}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div></div>
  <details class="panel"><summary data-act="toggle-panel" data-v="formulas"><span class="chev">${ICON.chev}</span><h3>Formulas used</h3></summary><div class="body small">
    <p>Revenue = units × weighted price × channel realization. Weighted price = Σ(mix × price).</p>
    <p>Variable cost = units × weighted unit cost + revenue × payment fee %. Contribution = revenue − variable cost.</p>
    <p>Fixed = listed fixed expenses + model extra fixed + payroll (hours × rate × 4.33 × (1 + payroll tax %)) + channel marketing spend.</p>
    <p>Operating result = contribution − fixed. Interest is shown separately below operating result. Owner pay is not an expense here.</p>
    <p>Break-even units / month = fixed ÷ unit contribution (weighted across SKUs and channels). None when unit contribution ≤ 0.</p>
    <p>Demand: new customers = contacts × lead % × qualified % × close %; repeat orders = past customers × repeat %; units = orders × units per order × seasonality. Units sold = min(demand, capacity); capacity = min(equipment setting, (owner + staff hours) ÷ hours per unit).</p>
    <p>Cash = prior cash + receipts − operating payments − debt service. Receipts lag revenue by each channel’s collection days (rounded to months). Opening cash = funding − startup uses.</p>
  </div></details>
  <div class="flex"><button class="btn" data-act="export-csv" data-v="pl">Export P&L (CSV)</button><button class="btn" data-act="export-csv" data-v="cash">Export cash flow (CSV)</button><button class="btn" data-act="export-csv" data-v="assumptions">Export assumptions (CSV)</button></div>`;
}

/* 90-day plan */
SCREEN_FN.plan = () => {
  const p = P(); if (!p) return needProject();
  const done = p.tasks.filter(t => t.done).length;
  const top = p.tasks.filter(t => !t.done).slice().sort((a, b) => num(b.value) - num(a.value) || num(a.week) - num(b.week)).slice(0, 3).map(t => t.id);
  const byId = Object.fromEntries(p.tasks.map(t => [t.id, t]));
  const filt = S.planGroup || 'All';
  const weeks = [...new Set(p.tasks.map(t => num(t.week)))].sort((a, b) => a - b);
  const taskCard = t => { const i = p.tasks.indexOf(t); const dep = byId[t.dependsOn]; const blocked = dep && !dep.done;
    return `<div class="task ${top.includes(t.id) ? 'top' : ''} ${t.done ? 'done' : ''}">
      <div class="between"><span class="label">${esc(t.group)}</span>${top.includes(t.id) ? '<span class="eyebrow">Top 3 action</span>' : ''}</div>
      <label class="flex" style="align-items:flex-start;flex-wrap:nowrap"><input type="checkbox" data-path="tasks.${i}.done" ${t.done ? 'checked' : ''} aria-label="Done"><span class="tt">${esc(t.title)}</span></label>
      <div class="small muted">${esc(t.owner)} · ${esc(t.duration)} · ${money(num(t.cost))}${t.evidence ? ' · ' + esc(t.evidence) : ''}</div>
      ${dep ? `<div class="small" style="color:${blocked ? 'var(--warn)' : 'var(--ok)'}">${blocked ? 'Waiting on' : 'After'}: ${esc(dep.title)}</div>` : ''}
      <div class="flex"><button class="btn sm ghost" data-act="task-move" data-v="${esc(t.id)}" data-d="-1" aria-label="Move earlier">↑ Earlier</button><button class="btn sm ghost" data-act="task-move" data-v="${esc(t.id)}" data-d="1" aria-label="Move later">↓ Later</button><button class="btn sm ghost" data-act="task-edit" data-v="${esc(t.id)}">Edit</button></div></div>`; };
  return `${headHTML('90-Day Launch Plan', 'Week-by-week tasks. Completing tasks raises readiness; the three highest-value open tasks are highlighted.', `<button class="btn" data-act="export-csv" data-v="tasks">Export checklist (CSV)</button><button class="btn primary" data-act="task-new">Add task</button>`)}
  <div class="card"><div class="between"><div><span class="label">Readiness</span><div class="figure" style="font:600 24px/30px var(--font-sans)">${p.tasks.length ? Math.round(done / p.tasks.length * 100) : 0}%</div></div><div style="flex:1;min-width:200px"><div class="bar-meter"><i style="width:${p.tasks.length ? done / p.tasks.length * 100 : 0}%"></i></div><span class="small muted">${done} of ${p.tasks.length} tasks done · ${money(p.tasks.reduce((s, t) => s + num(t.cost), 0))} planned spend</span></div></div>
  <div class="flex">${['All', ...GROUPS].map(g => `<button class="btn sm ${filt === g ? 'primary' : ''}" data-act="plan-group" data-v="${g}">${g}</button>`).join('')}</div></div>
  ${weeks.map(w => { const ts = p.tasks.filter(t => num(t.week) === w && (filt === 'All' || t.group === filt)); return ts.length ? `<section class="stack-sm"><h2>Week ${w}</h2><div class="board">${ts.map(taskCard).join('')}</div></section>` : ''; }).join('')}`;
};

    ${p.status === 'Ready' ? `<div class="flex"><button class="btn brass" data-act="publish">Mark as Published</button><span class="small muted">Records that the client-facing report was delivered.</span></div>` : ''}</div>
  <div class="sheet" id="report-sheet">${reportHTML(p, variant)}</div>`;
};
function reportHTML(p, variant) {
  const r = Engine.run(p); const T = r.totals; const L = r.months.map(x => monthLabel(r, x.i)); const sc = capScores(p, r);
  const internal = variant === 'internal';
  const items = reviewItems(p, r);
  const secs = ['Executive summary', 'Business model', 'Local market & competition', 'CAP strategy', 'OPS setup & operating manual', 'Staffing & equipment', 'Financial statements', 'Risk register', '90-day roadmap', 'Assumptions & source appendix'].concat(internal ? ['Consultant notes & audit'] : []);
  let pg = 1; const page = () => `<div class="pg">Mete Business Blueprint · ${esc(p.name)} · page ${++pg}</div>`;
  const tagged = (label, a) => `<tr><td>${label}</td><td class="n">${esc(a.v)}</td><td><span class="chip ${tagClass(a.tag)}">${esc(a.tag)}</span></td><td class="small">${esc((p.sources.find(s => s.id === a.src) || {}).title || '—')}</td></tr>`;
  return `
  <div class="cover"><div class="eyebrow" style="color:#7d6213">Mete Business Consulting · Business Blueprint${internal ? ' · Internal' : ''}</div><h1>${esc(p.name)}</h1>
    <div class="muted">${esc(p.profile.product || 'Product not provided')} · ${esc([p.profile.city, p.profile.state].filter(Boolean).join(', ') || 'Location not provided')} · ${p.profile.stage === 'existing' ? 'Existing business' : 'Startup'}</div>

/* ---------- mutations ---------- */
function setField(path, val, el) {
  const p = P(); if (!p) return;
  const before = getPath(p, path);
  if (String(before) === String(val)) return;
  setPath(p, path, val);
  // editing an assumption value confirms it as user input
  const m = path.match(/^fin\.a\.(\w+)\.v$/);
  if (m && p.fin.a[m[1]].tag === 'Assumption') { p.fin.a[m[1]].tag = 'User input'; const sel = document.querySelector(`[data-path="fin.a.${m[1]}.tag"]`); if (sel) sel.value = 'User input'; }
  const pm = path.match(/^(products|channels)\.(\d+)\.(price|unitCost|mix|share|realization)$/);
  if (pm && p[pm[1]][pm[2]].tag === 'Assumption') { p[pm[1]][pm[2]].tag = 'User input'; const sel = document.querySelector(`[data-path="${pm[1]}.${pm[2]}.tag"]`); if (sel) sel.value = 'User input'; }
  if (path === 'status') logAudit(p, { action: 'Changed status by hand', path, before, after: val });
  markDirty(p, { action: 'Edited', path, before: typeof before === 'object' ? '' : before, after: val });
  if (path === 'name') renderBar();
}
const STRUCTURAL = /^(settings\.consultant|settings\.reportVariant|status|risks\.\d+\.(status|severity)|tasks\.\d+\.done|ops\.quality\.\d+\.done|sources\.\d+\.(kind|confidence)|.*\.tag|.*\.src)$/;

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.actInput === 'dashq') { S.dashQ = el.value; const pos = el.selectionStart; renderContent(); const n = $('#dash-q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } return; }
  if (el.dataset.wiz) { S.wiz.data[el.dataset.wiz] = el.value; return; }
  if (el.dataset.weight) { const p = P(); const v = num(el.value); const rule = CAP_RULES.find(r => r.id === el.dataset.weight); if (v === rule.pts) delete p.capWeights[rule.id]; else p.capWeights[rule.id] = v; markDirty(p, { action: 'Changed CAP rule points', path: 'capWeights.' + rule.id, before: rule.pts, after: v }); return; }
  if (!el.dataset.path || el.type === 'checkbox' || el.tagName === 'SELECT') return;
  const v = el.dataset.num ? (el.value === '' ? 0 : parseFloat(el.value)) : el.value;
  if (el.dataset.num && !Number.isFinite(v)) return;
  setField(el.dataset.path, v, el);
  renderLiveExceptSave();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.actChange === 'pick') { S.cur = el.value; remember('cur', S.cur); render(); return; }
  if (el.dataset.wiz) { S.wiz.data[el.dataset.wiz] = el.value; return; }
  if (el.dataset.weight) { renderContent(); return; }
  if (!el.dataset.path) return;
  if (el.type === 'checkbox' || el.tagName === 'SELECT') {
    const v = el.type === 'checkbox' ? el.checked : el.value;
    setField(el.dataset.path, v, el);
  }
  if (STRUCTURAL.test(el.dataset.path) || el.tagName === 'SELECT' || el.type === 'checkbox') { const y = window.scrollY; renderSide(); renderBar(); renderContent(); window.scrollTo(0, y); }
  else { renderSide(); }
});
function renderLiveExceptSave() { document.querySelectorAll('[data-live]').forEach(el => { const k = el.dataset.live; if (k !== 'save' && LIVE[k]) el.innerHTML = LIVE[k](); }); }

document.addEventListener('submit', e => {

  const fd = Object.fromEntries(new FormData(f).entries()); const p = P();
  if (f.dataset.form === 'add-source') {
    const s = Object.assign({ id: uid('e'), flagged: false }, fd);
    p.sources.push(s); markDirty(p, { action: 'Added evidence', path: 'sources', after: s.claim }); S.tab.research = s.category; renderContent(); toast('Evidence added');
  }
  if (f.dataset.form === 'task') {
    const t = { title: fd.title, week: Math.min(13, Math.max(1, num(fd.week) || 1)), group: fd.group, owner: fd.owner, duration: fd.duration, cost: num(fd.cost), value: Math.min(5, Math.max(1, num(fd.value) || 1)), dependsOn: fd.dependsOn, evidence: fd.evidence };
    if (f.dataset.new) { p.tasks.push(Object.assign({ id: f.dataset.id, done: false }, t)); markDirty(p, { action: 'Added task', after: t.title }); }
    else { const x = p.tasks.find(x => x.id === f.dataset.id); const before = x.title; Object.assign(x, t); markDirty(p, { action: 'Edited task', before, after: t.title }); }
    closeModal(); renderContent();
  }
  if (f.dataset.form === 'reason') { const cb = S.reasonCb; closeModal(); cb && cb(fd.reason || ''); }
  if (f.dataset.form === 'snapshot') { saveVersion(fd.label); f.reset(); }
  if (f.dataset.form === 'review-item') {
    p.reviewManual = p.reviewManual || []; p.reviewManual.push({ id: uid('m'), kind: fd.kind, text: fd.text, blocking: fd.blocking === 'on' });
    markDirty(p, { action: 'Added review item', after: fd.text }); closeModal(); renderContent(); renderSide();
  }
});

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act; const v = t.dataset.v; const p = P();
  if (act === 'modal-bg') { if (e.target === t) closeModal(); return; }
  if (act === 'toggle-panel') { e.preventDefault(); S.expanded[v] = !S.expanded[v]; t.parentElement.open = S.expanded[v]; return; }
  switch (act) {
    case 'go': go(v); break;
    case 'menu': S.navOpen = !S.navOpen; $('#app').classList.toggle('open', S.navOpen); break;
    case 'open': S.cur = v; remember('cur', v); go('profile'); break;
    case 'tab': S.tab[t.dataset.k] = v; renderContent(); break;
    case 'modal-close': closeModal(); break;
    case 'load-example': { const x = normalize(exampleProject()); x.owner = S.me || ''; S.projects[x.id] = x; S.cur = x.id; remember('cur', x.id); markDirty(x); go('dashboard'); toast('Illustrative example loaded'); break; }
    case 'dup': { const src = S.projects[v]; const x = normalize(clone(src)); x.id = uid('p'); x.name = src.name + ' (copy)'; x.status = 'Draft'; x.signedOff = null; x.readyForLaunch = false; x.createdAt = x.updatedAt = new Date().toISOString(); x.owner = S.me || ''; x.audit = [{ at: x.createdAt, actor: S.me || '', action: 'Duplicated from ' + src.name }]; S.projects[x.id] = x; markDirty(x); renderContent(); renderBar(); toast('Duplicated'); break; }
    case 'archive': { const x = S.projects[v]; x.archived = true; markDirty(x, { action: 'Archived' }); if (S.cur === v) S.cur = sortedProjects()[0]?.id || null; render(); toast('Archived. Restore it from the Archived list.'); break; }
    case 'unarchive': { const x = S.projects[v]; x.archived = false; markDirty(x, { action: 'Restored from archive' }); render(); break; }
    case 'wiz-step': S.wiz.step = Math.min(5, Math.max(1, num(v))); renderContent(); break;
    case 'wiz-start': {
      const d = S.wiz.data; const x = normalize(starterProject(d)); x.owner = S.me || ''; x.status = 'Researching';
      x.audit.push({ at: new Date().toISOString(), actor: S.me || '', action: 'Started research (manual entry: live research unavailable)' });
      S.projects[x.id] = x; S.cur = x.id; remember('cur', x.id); S.wiz = { step: 1, data: {} }; markDirty(x); go('research'); toast('Blueprint created'); break; }
    case 'row-add': { const arr = getPath(p, t.dataset.path); const tpl = JSON.parse(t.dataset.tpl || '{}'); tpl.id = uid('x'); arr.push(tpl); markDirty(p, { action: 'Added row', path: t.dataset.path }); keepScroll(renderContent); break; }
    case 'row-del': { const arr = getPath(p, t.dataset.path); const [gone] = arr.splice(num(t.dataset.i), 1); markDirty(p, { action: 'Removed row', path: t.dataset.path, before: gone?.name || gone?.title || gone?.issue || gone?.claim || gone?.item || gone?.role || '' }); keepScroll(renderContent); renderSide(); break; }
    case 'save-now': if (p) { clearTimeout(saveTimers[p.id]); await saveProject(p.id); toast(S.saveState[p.id]?.startsWith('error') ? 'Not saved. Try again.' : 'Saved'); } break;
    case 'research': if (p) { if (p.status === 'Draft') { p.status = 'Researching'; markDirty(p, { action: 'Started research (manual entry: live research unavailable)' }); renderBar(); } go('research'); toast('Live research is not connected. Add evidence by hand.'); } break;
    case 'recalc': if (p) { renderLiveExceptSave(); renderContent(); renderSide(); logAudit(p, { action: 'Recalculated' }); toast('Recalculated: ' + money(Engine.run(p).totals.opResult) + ' 12-month operating result'); } break;
    case 'generate': if (p) { const r = Engine.run(p); const items = reviewItems(p, r); if (!['Ready', 'Published'].includes(p.status)) p.status = 'Needs Review'; markDirty(p, { action: 'Generated blueprint', after: `${items.length} review items, ${openBlocking(p, items).length} blocking` }); go('report'); toast(`Blueprint generated. ${openBlocking(p, items).length} blocking item(s) to review.`); } break;
    case 'share': openModal(`<h2>Share</h2><p>Sharing is controlled by the page’s own Share menu at the top of this window. Everyone you share the page with can open ${S.storeMode === 'shared' ? 'and edit the blueprints saved here' : 'the page, but blueprints in this view are saved in your browser only'}.</p><p class="small muted">Per-project permissions and client portals are planned for Phase 3.</p><div class="flex" style="justify-content:flex-end"><button class="btn primary" data-act="modal-close">OK</button></div>`); break;
    case 'remote-keep': delete S.remote[p.id]; saveProject(p.id); renderBanners(); break;
    case 'remote-load': S.projects[p.id] = S.remote[p.id]; delete S.remote[p.id]; S.dirty[p.id] = false; render(); break;
    case 'src-flag': { const s = p.sources.find(x => x.id === v); s.flagged = !s.flagged; markDirty(p, { action: s.flagged ? 'Marked evidence incorrect' : 'Cleared incorrect mark', after: s.claim }); renderContent(); renderSide(); break; }
    case 'src-refresh': toast('Refresh needs live research, which is not connected. Edit the finding by hand.'); break;
    case 'model': { const before = p.ops.selected; p.ops.selected = v; markDirty(p, { action: 'Changed operating model', path: 'ops.selected', before, after: v }); keepScroll(renderContent); renderSide(); toast(p.ops.models[v].name + ' model in use'); break; }
    case 'rec': { const id = v; const st = t.dataset.s; const doIt = reason => { p.recDecisions[id] = { status: st, reason, actor: S.me || '', at: new Date().toISOString() }; markDirty(p, { action: st + ' recommendation', path: 'cap.' + id, after: st, reason }); keepScroll(renderContent); };
      if (st === 'Dismissed') reasonModal('Dismiss recommendation', 'Say why this recommendation does not apply. The reason is kept in the audit log.', doIt); else doIt(''); break; }
    case 'risk-ack': { const x = p.risks.find(r => r.id === v); if (x.ack) { x.ack = false; markDirty(p, { action: 'Removed acknowledgment', path: 'risks', before: 'acknowledged', after: 'open' }); keepScroll(renderContent); break; }
      reasonModal('Acknowledge critical unknown', `“${esc(x.issue)}” is still unverified. Acknowledging lets the launch gate pass without verification. Record why.`, reason => { x.ack = true; markDirty(p, { action: 'Acknowledged critical unknown', path: 'risks', before: 'open', after: 'acknowledged', reason }); keepScroll(renderContent); }); break; }
    case 'ready-launch': { p.readyForLaunch = !p.readyForLaunch; markDirty(p, { action: p.readyForLaunch ? 'Marked ready for launch' : 'Cleared ready for launch' }); keepScroll(renderContent); break; }
    case 'plan-group': S.planGroup = v; renderContent(); break;
    case 'task-move': { const i = p.tasks.findIndex(x => x.id === v); const d = num(t.dataset.d); const x = p.tasks[i]; const nw = Math.min(13, Math.max(1, num(x.week) + d)); if (nw !== num(x.week)) { markDirty(p, { action: 'Moved task', before: 'week ' + x.week, after: 'week ' + nw }); x.week = nw; } keepScroll(renderContent); break; }
    case 'task-edit': taskModal(p.tasks.find(x => x.id === v)); break;
    case 'task-new': taskModal(null); break;
    case 'task-del': { const i = p.tasks.findIndex(x => x.id === v); const [g] = p.tasks.splice(i, 1); p.tasks.forEach(x => { if (x.dependsOn === v) x.dependsOn = ''; }); markDirty(p, { action: 'Deleted task', before: g.title }); closeModal(); renderContent(); break; }
    case 'decide': { const id = v; const st = t.dataset.s; const blocking = t.dataset.b === '1'; const needs = blocking || st !== 'Approve';
      const doIt = reason => { const before = p.reviewDecisions[id]?.status || 'Open'; p.reviewDecisions[id] = { status: st, reason, actor: S.me || '', at: new Date().toISOString() }; markDirty(p, { action: 'Review: ' + st, path: 'review.' + id, before, after: st, reason }); keepScroll(renderContent); renderSide(); };
      if (needs) reasonModal(st + (blocking ? ' blocking item' : ''), blocking ? 'This is a material item. A reason is required and kept in the audit log.' : 'Add a reason for the record.', doIt, true); else doIt(''); break; }
    case 'review-add': openModal(`<h2>Add review item</h2><form class="stack-sm" data-form="review-item"><div class="f"><label class="label" for="ri-k">Type</label><select id="ri-k" name="kind"><option>Unsupported assumption</option><option>Financial anomaly</option><option>Critical compliance item</option><option>Conflicting recommendation</option><option>Manual</option></select></div><div class="f"><label class="label" for="ri-t">Item</label><textarea id="ri-t" name="text" required rows="3"></textarea></div><label class="flex"><input type="checkbox" name="blocking"> Blocks sign-off</label><div class="flex" style="justify-content:flex-end"><button type="button" class="btn" data-act="modal-close">Cancel</button><button class="btn primary" type="submit">Add</button></div></form>`); break;
    case 'consultant-on': p.settings.consultant = true; markDirty(p, { action: 'Turned on consultant mode' }); renderContent(); break;
    case 'signoff': reasonModal('Consultant sign-off', 'Signing off marks this blueprint Ready. Add a note for the record.', reason => { p.signedOff = { actor: S.me || '', at: new Date().toISOString(), reason }; const before = p.status; p.status = 'Ready'; markDirty(p, { action: 'Consultant sign-off', path: 'status', before, after: 'Ready', reason }); render(); toast('Signed off. Status is Ready.'); }, false); break;
    case 'publish': { const before = p.status; p.status = 'Published'; markDirty(p, { action: 'Published', path: 'status', before, after: 'Published' }); render(); break; }
    case 'reset-weights': p.capWeights = {}; markDirty(p, { action: 'Reset CAP rule points' }); renderContent(); break;
    case 'restore': restoreVersion(v); break;
    case 'delete-ask': openModal(`<h2>Delete “${esc(p.name)}”?</h2><p>This removes the blueprint for everyone who uses this page. Download a backup first if you might need it.</p><div class="flex" style="justify-content:flex-end"><button class="btn" data-act="modal-close">Cancel</button><button class="btn danger" data-act="delete-do">Delete blueprint</button></div>`); break;
    case 'delete-do': { const id = p.id; closeModal(); clearTimeout(saveTimers[id]); delete S.projects[id]; S.dirty[id] = false; try { if (S.db) await S.db.doc('projects/' + id).delete(); else persistLocal(); } catch (err) { toast('Could not delete. Try again.'); } S.cur = sortedProjects()[0]?.id || null; go('dashboard'); toast('Blueprint deleted'); break; }
    case 'export-csv': exportCsv(v); break;
    case 'export-json': download(`${slug(p.name)}-backup.json`, JSON.stringify(p, null, 2)); break;
    case 'export-report': exportReport(); break;
  }
});
function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
async function restoreVersion(vid) {
  const p = P();
  try {
    const d = await S.db.doc('projects/' + p.id + '/versions/' + vid).get(); if (!d.exists) return toast('That version is gone.');
    await saveVersion('Before restore ' + new Date().toLocaleString('en-US'));
    const data = clone(d.data().project); data.updatedAt = new Date().toISOString();
    data.audit = (p.audit || []).concat([{ at: data.updatedAt, actor: S.me || '', action: 'Restored version', after: d.data().meta.label }]);
    S.projects[p.id] = normalize(data); markDirty(data); render(); toast('Restored: ' + d.data().meta.label);
  } catch (e) { toast('Could not restore that version.'); }
}

/* ---------- export ---------- */
const slug = s => String(s || 'blueprint').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'blueprint';
async function download(filename, data) {
  if (!S.dl) return toast('Downloads are not available in this view.');
  try { await S.dl.save({ filename, data }); } catch (e) { if (e?.code !== 'declined') toast(e?.code === 'rate_limited' ? 'A download prompt is already open.' : 'Download is not available here.'); }
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportCsv(kind) {
  const p = P(); const r = Engine.run(p); const L = r.months.map(x => monthLabel(r, x.i)); let rows = [];
  if (kind === 'pl') { rows.push(['Line', ...L, 'Total']); [['Units sold', 'units'], ['Revenue', 'revenue'], ['Cost of goods', 'cogs'], ['Variable costs', 'varCost'], ['Contribution', 'contribution'], ['Fixed expenses', 'fixed'], ['Operating result', 'opResult'], ['Interest', 'interest'], ['Result after interest', 'net']].forEach(([l, k]) => rows.push([l, ...r.months.map(x => x[k].toFixed(2)), r.totals[k].toFixed(2)])); }
  if (kind === 'cash') { rows.push(['Line', ...L]); [['Cash receipts', 'receipts'], ['Operating payments', 'payments'], ['Debt service', 'debtService'], ['Month-end cash', 'cash']].forEach(([l, k]) => rows.push([l, ...r.months.map(x => x[k].toFixed(2))])); rows.push(['Opening cash', r.cash0.toFixed(2)]); }
  if (kind === 'assumptions') { rows.push(['Assumption', 'Value', 'Basis', 'Source']); Object.entries(p.fin.a).forEach(([k, a]) => rows.push([k, a.v, a.tag, (p.sources.find(s => s.id === a.src) || {}).title || ''])); p.products.forEach(x => rows.push(['Product: ' + x.name, `price ${x.price}; cost ${x.unitCost}; mix ${x.mix}%`, x.tag, ''])); }
  if (kind === 'tasks') { rows.push(['Week', 'Group', 'Task', 'Owner', 'Depends on', 'Cost', 'Duration', 'Evidence', 'Done']); p.tasks.slice().sort((a, b) => num(a.week) - num(b.week)).forEach(t => rows.push([t.week, t.group, t.title, t.owner, (p.tasks.find(x => x.id === t.dependsOn) || {}).title || '', t.cost, t.duration, t.evidence, t.done ? 'Yes' : 'No'])); }
  if (p.illustrative) rows.unshift(['ILLUSTRATIVE EXAMPLE - sample data']);
  download(`${slug(p.name)}-${kind}.csv`, rows.map(r => r.map(csvCell).join(',')).join('\n'));
}
function exportReport() {
  const p = P(); const body = reportHTML(p, p.settings.reportVariant || 'client');
  const css = `body{font:14px/21px "IBM Plex Sans",Arial,sans-serif;color:#232c3a;background:#fff;margin:0}main{max-width:820px;margin:0 auto;padding:40px 32px;display:grid;gap:18px}h1{font:600 30px/36px "IBM Plex Serif",Georgia,serif;color:#1b2a4e;margin:0}h2{font:600 20px/26px "IBM Plex Serif",Georgia,serif;color:#1b2a4e;border-bottom:2px solid #c9a227;padding-bottom:4px;margin:8px 0 0}h3{font-size:14px;color:#1b2a4e;margin:0}p{margin:0}table{border-collapse:collapse;width:100%;font-size:12px}th{background:#f2eee5;text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#566172;padding:6px 8px}td{padding:5px 8px;border-bottom:1px solid #e2dccf;vertical-align:top}.n{text-align:right;font-variant-numeric:tabular-nums}.total td{font-weight:600;background:#f7f4ee}.muted{color:#566172}.small{font-size:12px;line-height:17px}.cover{border-left:6px solid #c9a227;padding:8px 0 8px 20px;display:grid;gap:8px}.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#7d6213}.chip,.illus{display:inline-block;border-radius:999px;padding:0 8px;font-size:10px;font-weight:600;background:#f2eee5}.illus{background:#c9a22726;color:#7d6213;border-radius:4px}.pg{font-size:10px;color:#566172;text-align:right;border-top:1px solid #e2dccf;padding-top:4px;break-after:page}.tw{overflow:visible}@media print{main{padding:0}.pg{break-after:page}}`;
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(p.name)} — Mete Business Blueprint</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Serif:wght@600&display=swap"><style>${css}</style></head><body><main>${body}</main></body></html>`;
  download(`${slug(p.name)}-blueprint.html`, html);
}

window.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal-root').innerHTML) closeModal(); else if (S.navOpen) { S.navOpen = false; $('#app').classList.remove('open'); } } });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.screen && SCREENS.some(s => s[0] === h)) go(h); });
$('#app').addEventListener('click', e => { if (S.navOpen && !e.target.closest('.side') && !e.target.closest('.menu-btn')) { S.navOpen = false; $('#app').classList.remove('open'); } });
boot();
